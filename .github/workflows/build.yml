# Builds and tests demirror for Linux and Windows on every push and pull request, and
# packages it: a tar.gz for Linux, a zip and an installer for Windows (with the display
# driver). A version tag (v0.2.0) also publishes them on the tag's GitHub release.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked --workspace
      - name: Lint
        run: cargo clippy --release --locked --workspace --all-targets -- -D warnings
      - name: Package
        run: |
          name=demirror-$(packaging/release-name.sh)-linux-x86_64
          mkdir -p dist/$name
          cp target/release/{demirror,vmon-server,vmon-client,vmon-vdisplayd} dist/$name/
          cp packaging/linux/{install-linux.sh,demirror.desktop,demirror-vdisplayd.service} dist/$name/
          cp packaging/icons/demirror.png README.md LICENSE-MIT LICENSE-APACHE dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked -p demirror -p vmon-server -p vmon-client
      - name: Test
        run: cargo test --release --locked -p vmon-proto -p vmon-server -p demirror
      - name: Display driver
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          packaging/windows/driver/build.ps1 -Out dist/stage/driver -Version $version
        env:
          # A certificate from a real authority, when the repository has one; otherwise
          # the driver is self-signed for this build.
          DEMIRROR_SIGN_PFX: ${{ secrets.DEMIRROR_SIGN_PFX }}
          DEMIRROR_SIGN_PASSWORD: ${{ secrets.DEMIRROR_SIGN_PASSWORD }}
      - name: Stage
        run: |
          Copy-Item target/release/demirror.exe, target/release/vmon-server.exe, target/release/vmon-client.exe, README.md, LICENSE-MIT, LICENSE-APACHE dist/stage/
      - name: Needs nothing but Windows
        run: packaging/windows/check-dependencies.ps1 dist/stage
      - name: Package
        run: |
          $name = "demirror-$(bash packaging/release-name.sh)-windows-x86_64"
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Rename-Item dist/stage $name
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc /Q "/DVersion=$version" "/DSource=$((Resolve-Path dist/$name).Path)" "/O$((Resolve-Path dist).Path)" "/F$name-setup" packaging/windows/demirror.iss
          if ($LASTEXITCODE) { throw "building the installer failed" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe

  publish:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
