# Builds demirror for Linux and Windows when a version tag (v0.1.0) is pushed, and
# publishes both on the tag's GitHub release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked --workspace
      - name: Package
        run: |
          name=demirror-${GITHUB_REF_NAME}-linux-x86_64
          mkdir -p dist/$name
          cp target/release/{demirror,vmon-server,vmon-client,vmon-vdisplayd} dist/$name/
          cp packaging/linux/{install-linux.sh,demirror.desktop,demirror-vdisplayd.service} dist/$name/
          cp README.md dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked -p demirror -p vmon-server -p vmon-client
      - name: Package
        shell: pwsh
        run: |
          $name = "demirror-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/release/demirror.exe, target/release/vmon-server.exe, target/release/vmon-client.exe, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  publish:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
