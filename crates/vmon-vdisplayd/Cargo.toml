[package]
name = "vmon-vdisplayd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "demirror virtual display service for Linux (VKMS)"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
vmon-proto = { version = "0.2.1", path = "../vmon-proto" }

[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.15.0"
rustix = { version = "1.1.6", features = ["fs", "mm", "net", "process"] }
