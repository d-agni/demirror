[package]
name = "vmon-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "demirror command-line client and native viewer"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = "1.0.229"
serde_json = "1.0.154"
softbuffer = "0.4.8"
tungstenite = "0.30.0"
ureq = { version = "3.5.0", default-features = false, features = ["json"] }
vmon-proto = { version = "0.3.0", path = "../vmon-proto" }
winit = "0.30.13"
zune-jpeg = "0.5.15"
