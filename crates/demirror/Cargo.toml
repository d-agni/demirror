[package]
name = "demirror"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Turn phones, tablets and other computers into extra monitors"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", features = ["persistence"] }
mdns-sd = "0.21.6"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tungstenite = "0.30.0"
ureq = { version = "3.5.0", default-features = false, features = ["json"] }
vmon-proto = { version = "0.3.1", path = "../vmon-proto" }
vmon-server = { version = "0.3.1", path = "../vmon-server" }
zune-jpeg = "0.5.15"

[build-dependencies]
winresource = "0.1.34"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
